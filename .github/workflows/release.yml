name: Release

# Publishes @packkit/core to npm via OIDC Trusted Publishing — no NPM_TOKEN.
# One-time setup (after the package exists on npm): npmjs.com → the @packkit/core
# package → Settings → Trusted Publisher → GitHub Actions, repo PackkitJS/packkit-core,
# workflow "release.yml". Then bump the version in package.json and run this workflow.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run check:pkg
      # Uses OIDC (id-token: write) — no token, and provenance is generated automatically.
      - run: npm publish
